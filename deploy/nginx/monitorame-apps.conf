# Virtual host exclusivo do MonitoraME. O nginx compartilhado encaminha apenas este domínio
# ao Next.js; os demais server blocks e aplicações não são alterados.

server {
    listen 80;
    server_name monitorame.amontadavalley.com.br;

    # Preserve o encaminhamento da API já usado pelo serviço deste host.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # todo o resto  ->  Next (porta 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # O serviço de dados (porta 8000) NÃO aparece aqui de propósito: só a API conversa com ele.
}
